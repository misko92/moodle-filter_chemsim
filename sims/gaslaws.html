<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gas Laws</title>
<style>
:root { --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb; --card: #f8fafc; --accent: #1d4ed8; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; color: var(--ink); font-family: Arial, Helvetica, sans-serif; font-size: 15px; }
body { padding: 12px 16px 24px; max-width: 1180px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0 0 6px; }
h2 { font-size: 15px; margin: 0 0 4px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 2px solid var(--line); margin-bottom: 10px; align-items: flex-end; }
.tabs button[data-mode] { border: none; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 10px 12px; color: var(--muted); font-weight: bold; margin-bottom: -2px; min-height: 0; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
canvas { display: block; width: 100%; height: auto; touch-action: none; }
button { font: inherit; font-size: 14px; padding: 8px 11px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; color: var(--ink); cursor: pointer; min-height: 40px; }
button:hover { background: #f1f5f9; }
button.on, button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .45; cursor: default; }
select { font: inherit; font-size: 15px; padding: 6px 8px; border-radius: 8px; border: 1px solid #cbd5e1; min-height: 40px; background: #fff; }
.ctl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; margin-top: 10px; }
.ctl > b { font-size: 13px; color: var(--muted); font-weight: normal; text-align: right; }
.ctl > div { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
input[type=range] { flex: 1 1 160px; height: 32px; min-width: 140px; }
.val { font-weight: bold; min-width: 6.5em; }
.legend { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; align-items: center; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }
.grad { display: inline-block; width: 70px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #2563eb, #22c55e, #f59e0b, #dc2626); vertical-align: 0; margin: 0 4px; }
table.stats { border-collapse: collapse; width: 100%; font-size: 14px; margin-top: 8px; }
table.stats td, table.stats th { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; }
table.stats th { font-size: 12px; color: var(--muted); font-weight: normal; }
table.stats td.k { font-weight: bold; color: #047857; }
.why { font-size: 14px; line-height: 1.5; margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: #fff; border: 1px solid var(--line); }
.warn { color: #b45309; }
.note { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
label.chk { font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.mode { display: none; } .mode.active { display: block; }
.gbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
.tourbtn { margin-left: auto; align-self: center; width: 34px; height: 34px; min-height: 34px; padding: 0; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); background: #fff; font-weight: bold; font-size: 17px; }
.tour-block { position: absolute; left: 0; top: 0; z-index: 900; }
.tour-hole { position: absolute; z-index: 901; border: 3px solid #facc15; border-radius: 10px; box-shadow: 0 0 0 9999px rgba(15, 23, 42, .55); pointer-events: none; transition: all .25s ease; }
.tour-card { position: absolute; z-index: 902; width: 340px; max-width: calc(100vw - 32px); background: #fff; border-radius: 12px; padding: 14px 16px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.3); font-size: 15px; line-height: 1.45; }
.tour-card .tstep { font-size: 12px; color: var(--muted); font-weight: bold; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; }
.tour-card .tbtns { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.tour-card .tbtns .skip { margin-right: auto; border: none; background: none; color: var(--muted); padding: 8px 4px; text-decoration: underline; }
</style>
</head>
<body>
<h1 id="title">Gas Laws</h1>
<nav class="tabs" id="tabs">
  <button data-mode="laws">Gas laws</button>
  <button data-mode="mix">Partial pressures</button>
  <button id="tour-btn" class="tourbtn" aria-label="Show how this page works" title="How this page works">?</button>
</nav>

<div class="row">
  <div class="card" style="flex:1 1 480px" id="boxcard">
    <canvas id="box" width="520" height="340" aria-label="Gas molecules in a container with a piston and a pressure gauge"></canvas>
    <div class="legend" id="legend"></div>
    <div class="ctl" id="ctl">
      <b class="lw">Piston</b>
      <div class="lw"><button id="b-lock">🔒 Locked (V constant)</button><button id="b-free">⇕ Free (P constant)</button></div>
      <b class="lw">Amount</b>
      <div class="lw"><input type="range" id="n" min="0.2" max="1" step="0.05" value="0.4"><span class="val" id="nv"></span></div>
      <b class="mx">Helium</b>
      <div class="mx"><input type="range" id="na" min="0" max="0.6" step="0.05" value="0.3"><span class="val" id="nav"></span></div>
      <b class="mx">Xenon</b>
      <div class="mx"><input type="range" id="nb" min="0" max="0.6" step="0.05" value="0.3"><span class="val" id="nbv"></span></div>
      <b>Temperature</b>
      <div><input type="range" id="temp" min="100" max="600" step="10" value="300"><span class="val" id="tempv"></span></div>
      <b id="vlbl">Volume</b>
      <div id="vrow"><input type="range" id="vol" min="4" max="20" step="0.1" value="9.8"><span class="val" id="volv"></span></div>
      <b class="lw fr">Outside pressure</b>
      <div class="lw fr"><input type="range" id="pext" min="0.2" max="10" step="0.05" value="1"><span class="val" id="pextv"></span></div>
      <b></b>
      <div><button id="b-rec" class="primary lw">● Record data point</button><button id="b-pause">❚❚ Pause</button></div>
    </div>
  </div>

  <div class="card" style="flex:1 1 480px" id="graphcard">
    <section class="mode" id="m-laws">
      <div class="gbar"><b style="font-size:13px;color:var(--muted)">Graph</b><select id="axis"></select>
        <label class="chk" id="degc-l"><input type="checkbox" id="degc"> T in °C</label>
        <button id="b-clear">Clear points</button></div>
    </section>
    <section class="mode" id="m-mix"><h2>Pressure of each gas</h2></section>
    <canvas id="graph" width="520" height="300" aria-label="Graph of the recorded gas data"></canvas>
    <div class="legend" id="glegend"></div>
    <table class="stats" id="table"></table>
    <div class="why" id="why"></div>
  </div>
</div>
<div class="note" id="foot"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const R = 8.314, RL = 0.08206;
const GASES = {N2: {f: "N₂", M: 0.02802, col: "#6366f1", r: 4.5}, He: {f: "He", M: 0.004003, col: "#0ea5e9", r: 3.3}, Xe: {f: "Xe", M: 0.1313, col: "#a855f7", r: 6}};
const PER = 0.005;                              // mol represented by each drawn molecule
const W = 520, H = 340, X0 = 30, X1 = 330, YB = 326, HMAX = 288, VMAX = 20, VMIN = 4, DEPTH = 200, SCALE = 0.12;
const S = {mode: "laws", hold: "V", n: 0.4, na: 0.3, nb: 0.3, T: 300, V: 9.8, Pext: 1, h: 9.8 / VMAX * HMAX, parts: [], hits: {}, rate: {N2: 0, He: 0, Xe: 0}, prate: 0,
  fx: [], recs: [], axis: "PV", degC: false, paused: false, stop: false};
function rnd(a, b) { return a + Math.random() * (b - a); }
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const vol = () => S.h / HMAX * VMAX;            // L, from the piston position
const yTop = () => YB - S.h;
function newPart(g, atInlet) {
  const M = GASES[g].M, sd = Math.sqrt(R * S.T / M), r = GASES[g].r;
  return {g, M, r, x: atInlet ? X0 + r + 2 : rnd(X0 + r, X1 - r), y: atInlet ? YB - 14 : rnd(yTop() + r, YB - r), z: rnd(0, DEPTH),
    vx: sd * Math.abs(gauss()), vy: sd * gauss(), vz: sd * gauss(), born: atInlet ? 1 : 0};
}
function setCount(g, want, atInlet) {           // add or remove molecules of one gas
  const have = S.parts.filter(p => p.g === g).length;
  if (want > have) for (let i = have; i < want; i++) S.parts.push(newPart(g, atInlet));
  else for (let i = have; i > want; i--) { const idx = S.parts.map((p, k) => p.g === g ? k : -1).filter(k => k >= 0); S.parts.splice(idx[Math.floor(Math.random() * idx.length)], 1); }
}
const count = g => S.parts.filter(p => p.g === g).length;
const ke = p => 0.5 * p.M * (p.vx * p.vx + p.vy * p.vy + p.vz * p.vz);
function Tof(g) { const ps = S.parts.filter(p => p.g === g); if (!ps.length) return S.T; return ps.reduce((t, p) => t + ke(p), 0) / ps.length / (1.5 * R); }
const gasesNow = () => S.mode === "mix" ? ["He", "Xe"] : ["N2"];
// pressure from the molecules themselves: P = nRT/V with T from their kinetic energy
const Pgas = g => count(g) * PER * RL * Tof(g) / vol();
const Ptot = () => gasesNow().reduce((t, g) => t + Pgas(g), 0);
const nTot = () => S.parts.length * PER;
function targetV() {
  if (S.mode === "laws" && S.hold === "P") {
    const v = nTot() * RL * S.T / S.Pext; S.stop = v < VMIN - 1e-9 ? "bottom" : v > VMAX + 1e-9 ? "top" : false;
    return Math.max(VMIN, Math.min(VMAX, v));
  }
  S.stop = false; return S.V;
}

// ---------------------------------------------------------------- dynamics (ideal gas: molecules only hit the walls)
function step(dt) {
  const ht = targetV() / VMAX * HMAX;
  S.h += (ht - S.h) * Math.min(1, dt / 0.35);
  if (Math.abs(ht - S.h) < 0.05) S.h = ht;
  for (const g of gasesNow()) {          // the walls are held at the set temperature
    const Tm = Tof(g);
    if (Math.abs(Tm / S.T - 1) > 0.002) { const f = Math.pow(S.T / Tm, 0.5 * Math.min(1, dt / 0.35)); for (const p of S.parts) if (p.g === g) { p.vx *= f; p.vy *= f; p.vz *= f; } }
  }
  const yt = yTop(), hits = {N2: 0, He: 0, Xe: 0}; let ph = 0;
  for (const p of S.parts) {
    p.x += p.vx * SCALE * dt; p.y += p.vy * SCALE * dt; p.z += p.vz * SCALE * dt;
    if (p.born) p.born = Math.max(0, p.born - dt * 1.5);
    const r = p.r, flash = (x, y, vert) => { if (S.fx.length < 60) S.fx.push({x, y, vert, t: 1}); };
    if (p.x < X0 + r) { p.x = X0 + r; p.vx = Math.abs(p.vx); hits[p.g]++; flash(X0, p.y, true); }
    if (p.x > X1 - r) { p.x = X1 - r; p.vx = -Math.abs(p.vx); hits[p.g]++; flash(X1, p.y, true); }
    if (p.y < yt + r) { if (p.vy < 0) { hits[p.g]++; ph++; flash(p.x, yt, false); } p.y = yt + r; p.vy = Math.abs(p.vy); }
    if (p.y > YB - r) { p.y = YB - r; p.vy = -Math.abs(p.vy); hits[p.g]++; flash(p.x, YB, false); }
    if (p.z < 0) { p.z = 0; p.vz = Math.abs(p.vz); hits[p.g]++; }
    if (p.z > DEPTH) { p.z = DEPTH; p.vz = -Math.abs(p.vz); hits[p.g]++; }
  }
  const k = Math.min(1, dt / 3);
  for (const g in hits) S.rate[g] += (hits[g] / dt - S.rate[g]) * k;
  S.prate += (ph / dt - S.prate) * Math.min(1, dt / 4);
  for (const f of S.fx) f.t -= dt * 4;
  S.fx = S.fx.filter(f => f.t > 0);
}

// ---------------------------------------------------------------- drawing: container, piston, gauge
const box = $("box"), bg = box.getContext("2d"), graph = $("graph"), gg = graph.getContext("2d");
function hiDPI(c, w, h) { const r = Math.min(2, window.devicePixelRatio || 1); c.width = w * r; c.height = h * r; c.getContext("2d").setTransform(r, 0, 0, r, 0, 0); }
hiDPI(box, W, H); hiDPI(graph, 520, 300);
function speedColour(t) {
  const stops = [[37, 99, 235], [34, 197, 94], [245, 158, 11], [220, 38, 38]], u = Math.max(0, Math.min(0.999, t)) * 3, i = Math.floor(u), f = u - i;
  const c = stops[i].map((v, k) => Math.round(v + (stops[i + 1][k] - v) * f)); return `rgb(${c})`;
}
const sig3 = v => v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v >= 1 ? v.toFixed(2) : v.toFixed(3);
function drawBox() {
  const g = bg; g.clearRect(0, 0, W, H);
  const yt = yTop(), warm = (S.T - 100) / 500;
  // gas region
  g.fillStyle = `rgb(${Math.round(244 + 11 * warm)},${Math.round(247 - 17 * warm)},${Math.round(252 - 42 * warm)})`; g.fillRect(X0, yt, X1 - X0, YB - yt);
  // inlet pipe
  g.fillStyle = "#94a3b8"; g.fillRect(4, YB - 22, X0 - 4, 14); g.fillStyle = "#475569"; g.fillRect(10, YB - 27, 6, 24);
  // walls
  g.strokeStyle = "#475569"; g.lineWidth = 4; g.beginPath(); g.moveTo(X0 - 2, 12); g.lineTo(X0 - 2, YB + 2); g.lineTo(X1 + 2, YB + 2); g.lineTo(X1 + 2, 12); g.stroke();
  // wall-hit flashes
  for (const f of S.fx) {
    g.strokeStyle = `rgba(234,88,12,${f.t})`; g.lineWidth = 3; g.beginPath();
    if (f.vert) { g.moveTo(f.x, f.y - 6); g.lineTo(f.x, f.y + 6); } else { g.moveTo(f.x - 6, f.y); g.lineTo(f.x + 6, f.y); }
    g.stroke();
  }
  // molecules (far ones first)
  const sorted = S.parts.slice().sort((a, b) => b.z - a.z);
  for (const p of sorted) {
    const r = p.r * (1.15 - 0.35 * p.z / DEPTH);
    const col = S.mode === "mix" ? GASES[p.g].col : speedColour(Math.hypot(p.vx, p.vy, p.vz) / (2.2 * Math.sqrt(2 * R * 300 / p.M)));
    if (p.born) { g.beginPath(); g.arc(p.x, p.y, r + 6 * p.born, 0, 6.283); g.fillStyle = `rgba(34,197,94,${0.35 * p.born})`; g.fill(); }
    g.beginPath(); g.arc(p.x, p.y, r, 0, 6.283); g.fillStyle = col; g.fill();
  }
  // piston + rod
  g.fillStyle = "#64748b"; g.fillRect((X0 + X1) / 2 - 6, 0, 12, yt - 12);
  g.fillStyle = "#334155"; g.fillRect(X0, yt - 13, X1 - X0, 13);
  g.fillStyle = "#cbd5e1"; g.fillRect(X0 + 4, yt - 9, X1 - X0 - 8, 3);
  if (S.mode === "laws" && S.hold === "P") {
    // weights stand for the outside pressure
    const nW = Math.max(1, Math.min(8, Math.round(S.Pext))), wy = yt - 13;
    for (let i = 0; i < nW; i++) { const bw = 70 - i * 3; g.fillStyle = i % 2 ? "#78716c" : "#57534e"; g.fillRect((X0 + X1) / 2 - bw / 2 - 40, wy - (i + 1) * 9, bw, 8); g.fillRect((X0 + X1) / 2 - bw / 2 + 40, wy - (i + 1) * 9, bw, 8); }
    g.fillStyle = "#1f2937"; g.font = "bold 12px Arial"; g.textAlign = "left"; g.fillText(`outside: ${S.Pext.toFixed(2)} atm`, X0 + 6, Math.max(12, wy - nW * 9 - 6));
    if (S.stop) { g.fillStyle = "#b45309"; g.fillText(S.stop === "top" ? "piston at the top stop" : "piston at the bottom stop", X0 + 6, yt + 16); }
  } else {
    // pins hold the piston
    for (const x of [X0 - 9, X1 + 9]) { g.fillStyle = "#dc2626"; g.beginPath(); g.arc(x, yt - 7, 5, 0, 6.283); g.fill(); }
    if (S.mode === "laws") { g.fillStyle = "#6b7280"; g.font = "11px Arial"; g.textAlign = "center"; g.fillText("⇕ drag piston", (X0 + X1) / 2 + 52, Math.max(12, yt - 18)); }
  }
  // volume ruler
  g.strokeStyle = "#94a3b8"; g.lineWidth = 1; g.fillStyle = "#6b7280"; g.font = "10px Arial"; g.textAlign = "left";
  for (let v = 0; v <= VMAX; v += 2) { const y = YB - v / VMAX * HMAX; g.beginPath(); g.moveTo(X1 + 5, y); g.lineTo(X1 + (v % 4 ? 9 : 13), y); g.stroke(); if (v % 4 === 0) g.fillText(v + " L", X1 + 15, y + 3); }
  // gauge
  const P = Ptot(), cx = 440, cy = 92, rr = 62, PMAX = 15;
  g.beginPath(); g.arc(cx, cy, rr, 0, 6.283); g.fillStyle = "#fff"; g.fill(); g.lineWidth = 4; g.strokeStyle = "#334155"; g.stroke();
  const ang = v => Math.PI * (0.75 + 1.5 * Math.min(v, PMAX) / PMAX);
  g.lineWidth = 1.5; g.strokeStyle = "#475569"; g.fillStyle = "#334155"; g.font = "10px Arial"; g.textAlign = "center";
  for (let v = 0; v <= PMAX; v++) { const a = ang(v), l = v % 5 ? 6 : 11; g.beginPath(); g.moveTo(cx + Math.cos(a) * (rr - 3), cy + Math.sin(a) * (rr - 3)); g.lineTo(cx + Math.cos(a) * (rr - 3 - l), cy + Math.sin(a) * (rr - 3 - l)); g.stroke(); if (v % 5 === 0) g.fillText(v, cx + Math.cos(a) * (rr - 22), cy + Math.sin(a) * (rr - 22) + 4); }
  const a = ang(P); g.strokeStyle = "#dc2626"; g.lineWidth = 3; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a) * (rr - 12), cy + Math.sin(a) * (rr - 12)); g.stroke();
  g.beginPath(); g.arc(cx, cy, 5, 0, 6.283); g.fillStyle = "#334155"; g.fill();
  g.font = "11px Arial"; g.fillText("atm", cx, cy + 26);
  g.font = "bold 16px Arial"; g.fillStyle = "#1f2937"; g.fillText(`P = ${sig3(P)} atm`, cx, cy + rr + 22);
  // readouts
  g.font = "14px Arial"; g.textAlign = "left"; g.fillStyle = "#1f2937";
  const lines = S.mode === "mix"
    ? [`V = ${vol().toFixed(1)} L`, `T = ${S.T} K`, `n(He) = ${(count("He") * PER).toFixed(2)} mol`, `n(Xe) = ${(count("Xe") * PER).toFixed(2)} mol`]
    : [`V = ${vol().toFixed(1)} L`, `T = ${S.T} K`, `n = ${nTot().toFixed(2)} mol`];
  lines.forEach((t, i) => g.fillText(t, 384, 200 + i * 20));
  g.fillStyle = "#6b7280"; g.font = "12px Arial";
  g.fillText(`piston hits: ${Math.round(S.prate)} per s`, 384, 200 + lines.length * 20 + 4);
  if (S.paused) { g.font = "bold 15px Arial"; g.fillStyle = "#334155"; g.fillText("Paused", X0 + 6, YB - 8); }
}

// ---------------------------------------------------------------- graph tab: recorded points
const AX = {
  PV: {x: "V", y: "P", held: ["n", "T"], law: "Boyle's law: P ∝ 1/V", calc: "PV", calcLbl: "P × V (atm·L)"},
  PinvV: {x: "invV", y: "P", held: ["n", "T"], law: "Boyle's law: P ∝ 1/V", calc: "PV", calcLbl: "P × V (atm·L)"},
  PT: {x: "T", y: "P", held: ["n", "V"], law: "Gay-Lussac's law: P ∝ T", calc: "P/T", calcLbl: "P / T (atm/K)"},
  VT: {x: "T", y: "V", held: ["n", "P"], law: "Charles's law: V ∝ T", calc: "V/T", calcLbl: "V / T (L/K)"},
  Pn: {x: "n", y: "P", held: ["T", "V"], law: "P ∝ n", calc: "P/n", calcLbl: "P / n (atm/mol)"},
  Vn: {x: "n", y: "V", held: ["T", "P"], law: "Avogadro's law: V ∝ n", calc: "V/n", calcLbl: "V / n (L/mol)"}
};
const AXNAME = {PV: "P vs V", PinvV: "P vs 1/V", PT: "P vs T", VT: "V vs T", Pn: "P vs n", Vn: "V vs n"};
const QLBL = {P: "Pressure (atm)", V: "Volume (L)", invV: "1/V (1/L)", n: "Amount of gas (mol)"};
const VARNAME = {n: "n", T: "T", V: "V", P: "P"};
$("axis").innerHTML = Object.keys(AX).map(k => `<option value="${k}">${AXNAME[k]}</option>`).join("");
function xval(r, q) { return q === "invV" ? 1 / r.V : q === "T" && S.degC ? r.T - 273 : r[q]; }
function calcVal(r, c) { return c === "PV" ? r.P * r.V : c === "P/T" ? r.P / r.T : c === "V/T" ? r.V / r.T : c === "P/n" ? r.P / r.n : r.V / r.n; }
function niceUp(v) { const e = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (v <= m * e + 1e-9) return m * e; return 10 * e; }
const GX0 = 56, GX1 = 505, GY0 = 14, GY1 = 250;
function nowRec() { return {n: +nTot().toFixed(3), T: S.T, V: +vol().toFixed(2), P: Ptot()}; }
function drawLaws() {
  const g = gg; g.clearRect(0, 0, 520, 300);
  const ax = AX[S.axis], cur = nowRec(), pts = S.recs;

  const cw = card.offsetWidth, ch = card.offsetHeight, docH = de.scrollHeight;
  let cy = hy + hh + 12;
  if (cy + ch > docH - 8 && hy - ch - 12 > 0) cy = hy - ch - 12;
  const cx = Math.max(16 + sx, Math.min(hx, sx + de.clientWidth - cw - 16));
  Object.assign(card.style, {left: cx + "px", top: cy + "px"});
  if (scroll) {
    const top = Math.min(hy, cy), h = Math.max(hy + hh, cy + ch) - top;
    let f = document.getElementById("tour-focus");
    if (!f) { f = document.createElement("div"); f.id = "tour-focus"; f.style.cssText = "position:absolute;left:0;width:1px;pointer-events:none"; document.body.appendChild(f); }
    f.style.top = top + "px"; f.style.height = h + "px";
    f.scrollIntoView({block: h < window.innerHeight * 0.9 ? "center" : "start", behavior: "smooth"});
    card.querySelector('[data-t="next"]').focus({preventScroll: true});
  }
}
function tourEnd(markSeen) {
  if (!tour.els) return;
  if (markSeen) tourMark(tour.mode);
  for (const e of Object.values(tour.els)) e.remove();
  tour.els = null; tour.mode = null;
}
window.addEventListener("resize", () => tourShow(false));
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && tour.els) tourEnd(true); });

// ---------------------------------------------------------------- run
let last = performance.now(), tableT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!S.paused) step(dt);
  drawBox(); S.mode === "mix" ? drawMix() : drawLaws();
  if (S.mode === "mix" && (tableT -= dt) <= 0) { tableT = 0.5; drawTable(); }
  requestAnimationFrame(frame);
}
(function init() {
  const q = new URLSearchParams(location.search);
  if (q.get("title") === "0") $("title").style.display = "none";
  if (q.get("tour") === "0") tour.auto = false;
  const g = q.get("graph"); if (g && AX[g]) { S.axis = g; $("axis").value = g; }
  $("tour-btn").onclick = () => tourStart(S.mode);
  setMode(q.get("mode") === "mix" ? "mix" : "laws");
  requestAnimationFrame(frame);
})();
// tell an embedding page (filter_chemsim) how tall we are
(function () {
  if (window.parent === window) return;
  const send = () => window.parent.postMessage({chemsim: "height", h: document.documentElement.scrollHeight}, "*");
  new ResizeObserver(send).observe(document.body); window.addEventListener("load", send);
})();
</script>
<script>
// Full-screen view (opened from Moodle with ?back=...): show a bar that leads back to the course page.
(function () {
  if (window.parent !== window) return;
  var b = new URLSearchParams(location.search).get("back"), u;
  if (!b) return;
  try { u = new URL(b, location.href); } catch (e) { return; }
  if (u.origin !== location.origin) return;   // only ever lead back into this site
  var bar = document.createElement("div");
  bar.setAttribute("style", "position:sticky;top:0;z-index:50;background:#1e293b;margin:-12px -16px 12px;padding:8px 16px;display:flex;align-items:center;gap:12px");
  var a = document.createElement("a");
  a.href = u.href; a.textContent = "\u2190 Back to Moodle";
  a.setAttribute("style", "color:#fff;font:bold 15px Arial,sans-serif;text-decoration:none;padding:8px 12px;border:1px solid #64748b;border-radius:8px;background:#334155");
  bar.appendChild(a);
  document.body.insertBefore(bar, document.body.firstChild);
})();
</script>
